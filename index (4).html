<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>厚生労働省 新着情報ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* このファイルは外部CDN（Tailwind等）に依存せず、単体で完結します。
     社内ネットワークで外部スクリプトがブロックされていても表示が壊れません。
     フォントの読み込みに失敗した場合も、下記のフォールバック体（游ゴシック等）で表示されます。 */

  :root {
    --color-bg: #F3F4F7;
    --color-surface: #FFFFFF;
    --color-ink: #1B2A4A;
    --color-ink-soft: #5B6472;
    --color-ink-faint: #8891A0;
    --color-line: #E1E4EA;
    --color-navy-deep: #14213D;
    --color-accent-critical: #A93226;
    --color-accent-critical-bg: #FBEAE8;
    --color-accent-warn: #A5761F;
    --color-accent-warn-bg: #F8F0DE;
    --color-accent-quiet: #8C94A3;
    --color-accent-quiet-bg: #EEF0F3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
    background: var(--color-bg);
    color: var(--color-ink);
  }

  .font-mincho { font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif; }

  :focus-visible {
    outline: 2px solid var(--color-ink);
    outline-offset: 2px;
  }

  .hidden { display: none !important; }

  .line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ---------- 汎用ユーティリティ（Tailwindを使わずこのファイル内で完結） ---------- */
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .flex-wrap { flex-wrap: wrap; }
  .items-center { align-items: center; }
  .items-end { align-items: flex-end; }
  .justify-between { justify-content: space-between; }
  .flex-1 { flex: 1 1 0%; }
  .min-w-0 { min-width: 0; }
  .ml-auto { margin-left: auto; }
  .w-full { width: 100%; }
  .text-center { text-align: center; }
  .inline-block { display: inline-block; }

  .gap-2  { gap: 0.5rem; }
  .gap-3  { gap: 0.75rem; }
  .gap-0-5 { gap: 0.15rem; }
  .gap-x-2 { column-gap: 0.5rem; }
  .gap-y-1 { row-gap: 0.25rem; }

  .mt-0-5 { margin-top: 0.125rem; }
  .mt-3   { margin-top: 0.75rem; }
  .mt-2-5 { margin-top: 0.6rem; }
  .mb-3   { margin-bottom: 0.75rem; }
  .mb-4   { margin-bottom: 1rem; }

  .px-3   { padding-left: 0.75rem; padding-right: 0.75rem; }
  .px-2-5 { padding-left: 0.6rem;  padding-right: 0.6rem; }
  .px-4   { padding-left: 1rem;    padding-right: 1rem; }
  .py-1-5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
  .py-2   { padding-top: 0.5rem;   padding-bottom: 0.5rem; }
  .py-4   { padding-top: 1rem;     padding-bottom: 1rem; }
  .py-8   { padding-top: 2rem;     padding-bottom: 2rem; }
  .py-24  { padding-top: 6rem;     padding-bottom: 6rem; }
  .p-4    { padding: 1rem; }

  .text-xs  { font-size: 0.75rem; }
  .text-sm  { font-size: 0.875rem; }
  .text-lg  { font-size: 1.125rem; }
  .font-medium   { font-weight: 500; }
  .font-semibold { font-weight: 600; }
  .tracking-tight { letter-spacing: -0.01em; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  .whitespace-nowrap { white-space: nowrap; }

  .rounded-md { border-radius: 8px; }
  .rounded-lg { border-radius: 10px; }
  .rounded-full { border-radius: 999px; }
  .border { border: 1px solid var(--color-line); }

  .sticky { position: sticky; }
  .top-0  { top: 0; }
  .z-20   { z-index: 20; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .animate-spin { animation: spin 0.8s linear infinite; }

  /* ---------- ヘッダー ---------- */
  .site-header {
    background: var(--color-navy-deep);
    color: #FFFFFF;
  }
  .header-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1rem;
  }
  .header-title {
    font-size: 1.05rem;
  }
  @media (min-width: 640px) {
    .header-title { font-size: 1.25rem; }
  }
  .header-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
  }
  .header-meta { color: rgba(255,255,255,0.7); }
  .header-btn {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    cursor: pointer;
    transition: background-color .12s ease;
  }
  .header-btn:hover { background: rgba(255,255,255,0.1); }

  /* ---------- レイアウト ---------- */
  .app-shell {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
    max-width: 1180px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
  }
  @media (min-width: 900px) {
    .app-shell {
      grid-template-columns: 260px 1fr;
      align-items: start;
    }
  }

  /* ---------- サイドバー ---------- */
  .sidebar {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: 10px;
    padding: 1.25rem;
  }
  @media (min-width: 900px) {
    .sidebar { position: sticky; top: 88px; }
  }

  .filter-group + .filter-group {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--color-line);
  }

  .filter-label {
    font-size: 0.75rem;
    color: var(--color-ink-faint);
    margin-bottom: 0.6rem;
    letter-spacing: 0.02em;
  }

  .search-input {
    width: 100%;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--color-line);
    font-size: 0.875rem;
    font-family: inherit;
    color: var(--color-ink);
  }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    width: 100%;
    text-align: left;
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    font-size: 0.85rem;
    color: var(--color-ink-soft);
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    transition: background-color .12s ease, color .12s ease;
    font-family: inherit;
  }
  .filter-option:hover { background: var(--color-bg); }
  .filter-option[data-active="true"] {
    background: var(--color-ink);
    color: #fff;
    font-weight: 700;
  }
  .filter-count {
    margin-left: auto;
    font-size: 0.72rem;
    color: inherit;
    opacity: 0.65;
  }

  /* ---------- メインコンテンツ ---------- */
  .toolbar-btn {
    background: #fff;
    color: var(--color-ink);
    cursor: pointer;
    font-family: inherit;
  }
  .sort-select {
    font-family: inherit;
    color: var(--color-ink);
    background: #fff;
    border: 1px solid var(--color-line);
  }

  .config-banner {
    background: var(--color-accent-warn-bg);
    color: var(--color-accent-warn);
  }

  .state-block { color: var(--color-ink-faint); }
  .state-error-text { color: var(--color-accent-critical); font-weight: 500; }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--color-line);
    border-top-color: var(--color-ink);
    border-radius: 999px;
  }

  .result-panel {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: 10px;
    overflow: hidden;
  }

  .entry {
    display: flex;
    gap: 0;
    border-left: 4px solid var(--color-accent-quiet);
    padding: 1.05rem 1.25rem;
    border-bottom: 1px solid var(--color-line);
    transition: background-color .12s ease;
    opacity: 0;
    animation: entry-in .35s ease forwards;
  }
  .entry:last-child { border-bottom: none; }
  .entry:hover { background: #FAFAFB; }
  .entry[data-level="3"] { border-left-color: var(--color-accent-critical); }
  .entry[data-level="2"] { border-left-color: var(--color-accent-warn); }

  @keyframes entry-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .entry { animation: none; opacity: 1; }
    .animate-spin { animation: none; }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge[data-level="3"] { background: var(--color-accent-critical-bg); color: var(--color-accent-critical); }
  .badge[data-level="2"] { background: var(--color-accent-warn-bg); color: var(--color-accent-warn); }
  .badge[data-level="1"] { background: var(--color-accent-quiet-bg); color: var(--color-accent-quiet); }

  .category-label {
    font-size: 0.72rem;
    color: var(--color-ink);
    border-bottom: 2px solid var(--color-line);
    padding-bottom: 0.1rem;
    display: inline-block;
  }

  .entry-title {
    font-size: 1.02rem;
    line-height: 1.5;
    margin-top: 0.4rem;
    margin-bottom: 0;
  }

  .entry-summary {
    color: var(--color-ink-soft);
    font-size: 0.86rem;
    margin-top: 0.3rem;
    margin-bottom: 0;
  }

  .tag-list span {
    font-size: 0.74rem;
    color: var(--color-ink-faint);
  }

  .open-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--color-ink);
    white-space: nowrap;
    text-decoration: none;
  }
  .open-link svg { width: 13px; height: 13px; }
  .open-link:hover { text-decoration: underline; }

  /* ---------- モバイル用フィルタトグル ---------- */
  .mobile-filter-toggle {
    display: none;
    background: #fff;
    color: var(--color-ink);
    cursor: pointer;
    font-family: inherit;
  }
  @media (max-width: 899px) {
    .sidebar { display: none; }
    .sidebar.is-open { display: block; }
    .mobile-filter-toggle { display: inline-flex; }
  }

  .seal-mark {
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: var(--color-accent-critical);
    flex-shrink: 0;
  }

  .site-footer {
    text-align: center;
    font-size: 0.75rem;
    padding: 2rem 1rem;
    color: var(--color-ink-faint);
  }
</style>
</head>
<body>

  <!-- ===================== ヘッダー ===================== -->
  <header class="site-header sticky top-0 z-20">
    <div class="header-inner flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-3">
        <span class="seal-mark"></span>
        <div>
          <h1 class="font-mincho header-title font-semibold tracking-tight" style="margin:0;">厚生労働省 新着情報ダッシュボード</h1>
          <p class="header-sub mt-0-5" style="margin:2px 0 0;">社内共有用　法令・通達を毎日自動収集</p>
        </div>
      </div>
      <div class="flex items-center gap-3 text-xs header-meta">
        <span id="lastUpdated">読み込み中...</span>
        <button id="refreshBtn" class="header-btn px-3 py-1-5 rounded-md font-medium">
          更新
        </button>
      </div>
    </div>
  </header>

  <div class="app-shell">

    <!-- ===================== サイドバー（フィルタ） ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="filter-group">
        <div class="filter-label">検索</div>
        <input
          id="searchInput"
          type="text"
          placeholder="タイトル・概要・タグ"
          class="search-input"
        >
      </div>

      <div class="filter-group">
        <div class="filter-label">部署・区分</div>
        <div id="categoryList" class="flex flex-col gap-0-5"></div>
      </div>

      <div class="filter-group">
        <div class="filter-label">実務影響度</div>
        <div id="importanceList" class="flex flex-col gap-0-5"></div>
      </div>
    </aside>

    <!-- ===================== メイン ===================== -->
    <main>

      <div id="configBanner" class="hidden config-banner mb-4 p-4 rounded-lg text-sm">
        GASのWebアプリURLが設定されていません。<code>index.html</code> 内の <code>GAS_API_URL</code> を、デプロイしたエンドポイントURLに書き換えてください。
      </div>

      <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
        <button id="mobileFilterToggle" class="mobile-filter-toggle px-3 py-1-5 rounded-md text-xs font-medium border">
          絞り込み
        </button>
        <span id="resultCount" class="text-xs state-block">-</span>
        <select id="sortOrder" class="sort-select text-xs rounded-md px-2-5 py-1-5 ml-auto">
          <option value="desc">公開日: 新しい順</option>
          <option value="asc">公開日: 古い順</option>
        </select>
      </div>

      <div id="loadingState" class="text-center py-24 state-block">
        <div class="spinner animate-spin inline-block"></div>
        <p class="mt-3 text-sm" style="margin-top:0.75rem;">データを取得しています...</p>
      </div>

      <div id="errorState" class="hidden text-center py-24">
        <p class="state-error-text" style="margin:0;">データの取得に失敗しました。</p>
        <p id="errorDetail" class="text-xs state-block mt-3" style="margin-top:0.5rem;"></p>
      </div>

      <div id="emptyState" class="hidden text-center py-24 text-sm state-block">
        条件に一致するデータが見つかりませんでした。
      </div>

      <div id="resultPanel" class="result-panel"></div>

    </main>
  </div>

  <footer class="site-footer">
    データ出典: 厚生労働省ウェブサイト（新着情報RSS） / 本ダッシュボードは非公式のツールです
  </footer>

<script>
/* ==========================================================
   設定：ここにデプロイしたGASのWebアプリURL（/exec）を入れる
   ========================================================== */
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz4Otxh7LTgRerPbBFy-R3aw-pe8JsJfjqUMhN6fSLo8q5dKRYF-6cLWgpatS-5emq8CQ/exec"; // 例: https://script.google.com/macros/s/xxxxx/exec

const CATEGORIES = [
  "すべて", "労働基準局", "雇用環境・均等局", "職業安定局", "社会保険",
  "医薬・生活衛生局", "医政局", "健康局", "社会・援護局", "老健局",
  "子ども家庭局", "統計情報", "大臣官房・報道発表", "その他"
];
const IMPORTANCE_LEVELS = [
  { value: "all", label: "すべて" },
  { value: "★★★", label: "★★★ のみ" },
  { value: "★★", label: "★★ 以上" },
  { value: "★", label: "★ 以上" }
];

let allData = [];
let currentCategory = "すべて";
let currentImportance = "all";

const els = {
  loading: document.getElementById('loadingState'),
  error: document.getElementById('errorState'),
  errorDetail: document.getElementById('errorDetail'),
  empty: document.getElementById('emptyState'),
  panel: document.getElementById('resultPanel'),
  search: document.getElementById('searchInput'),
  sort: document.getElementById('sortOrder'),
  categoryList: document.getElementById('categoryList'),
  importanceList: document.getElementById('importanceList'),
  resultCount: document.getElementById('resultCount'),
  lastUpdated: document.getElementById('lastUpdated'),
  refreshBtn: document.getElementById('refreshBtn'),
  configBanner: document.getElementById('configBanner'),
  sidebar: document.getElementById('sidebar'),
  mobileToggle: document.getElementById('mobileFilterToggle'),
};

function importanceRank(star) {
  if (star === '★★★') return 3;
  if (star === '★★') return 2;
  return 1;
}

function countFor(predicate) {
  return allData.filter(predicate).length;
}

function buildCategoryList() {
  els.categoryList.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const count = cat === 'すべて' ? allData.length : countFor(d => d.category === cat);
    const btn = document.createElement('button');
    btn.className = 'filter-option';
    btn.dataset.active = String(cat === currentCategory);
    btn.innerHTML = `<span>${escapeHtml(cat)}</span><span class="filter-count">${count}</span>`;
    btn.addEventListener('click', () => {
      currentCategory = cat;
      buildCategoryList();
      render();
    });
    els.categoryList.appendChild(btn);
  });
}

function buildImportanceList() {
  els.importanceList.innerHTML = '';
  IMPORTANCE_LEVELS.forEach(level => {
    const count = level.value === 'all' ? allData.length : countFor(d => importanceRank(d.importance) >= importanceRank(level.value));
    const btn = document.createElement('button');
    btn.className = 'filter-option';
    btn.dataset.active = String(level.value === currentImportance);
    btn.innerHTML = `<span>${escapeHtml(level.label)}</span><span class="filter-count">${count}</span>`;
    btn.addEventListener('click', () => {
      currentImportance = level.value;
      buildImportanceList();
      render();
    });
    els.importanceList.appendChild(btn);
  });
}

async function loadData() {
  els.loading.classList.remove('hidden');
  els.error.classList.add('hidden');
  els.empty.classList.add('hidden');
  els.configBanner.classList.add('hidden');
  els.panel.innerHTML = '';

  if (!GAS_API_URL || GAS_API_URL.indexOf('YOUR_GAS_WEBAPP_URL_HERE') !== -1) {
    els.configBanner.classList.remove('hidden');
    els.loading.classList.add('hidden');
    els.lastUpdated.textContent = '未接続';
    buildCategoryList();
    buildImportanceList();
    return;
  }

  try {
    const res = await fetch(GAS_API_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.status !== 'ok') throw new Error('APIエラー');

    allData = json.data || [];
    els.lastUpdated.textContent = '最終取得: ' + new Date().toLocaleString('ja-JP');
    els.loading.classList.add('hidden');
    buildCategoryList();
    buildImportanceList();
    render();
  } catch (err) {
    els.loading.classList.add('hidden');
    els.error.classList.remove('hidden');
    els.errorDetail.textContent = err.message || String(err);
  }
}

function render() {
  const keyword = els.search.value.trim().toLowerCase();
  const sortOrder = els.sort.value;

  let filtered = allData.filter(item => {
    if (currentCategory !== 'すべて' && item.category !== currentCategory) return false;
    if (currentImportance !== 'all' && importanceRank(item.importance) < importanceRank(currentImportance)) return false;
    if (keyword) {
      const haystack = ((item.title || '') + ' ' + (item.summary || '') + ' ' + (item.tag || '')).toLowerCase();
      if (haystack.indexOf(keyword) === -1) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    const da = new Date(a.published_date);
    const db = new Date(b.published_date);
    return sortOrder === 'asc' ? da - db : db - da;
  });

  els.resultCount.textContent = filtered.length + ' 件表示中（全 ' + allData.length + ' 件）';

  els.panel.innerHTML = '';
  if (filtered.length === 0) {
    els.empty.classList.remove('hidden');
    return;
  }
  els.empty.classList.add('hidden');

  filtered.forEach((item, i) => {
    els.panel.appendChild(buildEntry(item, i));
  });
}

function buildEntry(item, index) {
  const level = importanceRank(item.importance);
  const entry = document.createElement('article');
  entry.className = 'entry';
  entry.dataset.level = String(level);
  entry.style.animationDelay = (Math.min(index, 12) * 0.03) + 's';

  const tags = (item.tag || '').split(';').filter(Boolean).slice(0, 5);

  entry.innerHTML = `
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="flex items-center gap-3 flex-wrap">
          <span class="text-xs tabular-nums" style="color: var(--color-ink-faint);">${escapeHtml(item.published_date || '')}</span>
          <span class="category-label">${escapeHtml(item.category || 'その他')}</span>
        </div>
        <span class="badge" data-level="${level}">${escapeHtml(item.importance || '★')}</span>
      </div>
      <h2 class="entry-title font-mincho font-semibold line-clamp-2">${escapeHtml(item.title || '(無題)')}</h2>
      <p class="entry-summary line-clamp-2">${escapeHtml(item.summary || '')}</p>
      <div class="flex items-end justify-between mt-2-5 gap-3 flex-wrap">
        <div class="tag-list flex flex-wrap gap-x-2 gap-y-1">
          ${tags.map(t => `<span>#${escapeHtml(t)}</span>`).join('')}
        </div>
        <a href="${escapeAttr(item.url)}" target="_blank" rel="noopener" class="open-link">
          原文を見る
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
      </div>
    </div>
  `;
  return entry;
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(str) { return escapeHtml(str); }

// イベント登録
els.search.addEventListener('input', render);
els.sort.addEventListener('change', render);
els.refreshBtn.addEventListener('click', loadData);
